@if (items?.length > 0) {
  <ul class="list-none p-0 m-0">
    @for (item of items; track $index) {
      <li class="flex items-center py-3 px-2 border-t border-surface flex-wrap gap-2">
        <!-- Label 1 -->
        <label
          class="text-500 basis-1/3 md:basis-1/6 font-medium"
          [attr.for]="'description-list-' + item.i0.label"
          [attr.id]="'description-list-label-' + item.i0.label"
        >
          {{ item.i0.label || '-' }}
        </label>
        <!-- Value 1 -->
        <p class="text-900 flex-1 md:basis-1/3" [attr.id]="'description-list-' + item.i0.label">
          {{ item.i0.value || '-' }}
        </p>

        @if (item.i1 && !mobile) {
          <!-- Label 2 -->
          <label
            class="text-500 basis-1/3 md:basis-1/6 font-medium"
            [attr.for]="'description-list-' + item.i1.label"
            [attr.id]="'description-list-label-' + item.i1.label"
          >
            {{ item.i1.label || '-' }}
          </label>
          <!-- Value 2 -->
          <p class="text-900 flex-1 md:basis-1/3" [attr.id]="'description-list-' + item.i1.label">
            {{ item.i1.value || '-' }}
          </p>
        }
      </li>

      @if (mobile && item.i1) {
        <li class="flex items-center py-3 px-2 border-t border-surface flex-wrap gap-2">
          <!-- Label mobile -->
          <label
            class="text-500 basis-1/3 md:basis-1/6 font-medium"
            [attr.for]="'description-list-' + item.i1.label"
            [attr.id]="'description-list-label-' + item.i1.label"
          >
            {{ item.i1.label || '-' }}
          </label>
          <!-- Value mobile -->
          <p class="text-900 flex-1 md:basis-2/3" [attr.id]="'description-list-' + item.i1.label">
            {{ item.i1.value || '-' }}
          </p>
        </li>
      }
    }
  </ul>
}
